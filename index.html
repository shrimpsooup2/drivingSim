<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FTC Driving Simulator</title>
    <meta
      name="description"
      content="A physics-accurate FTC drivetrain simulator for driver practice: mecanum, tank, omni and X-drive with a real motor, battery and traction model."
    />
    <link rel="stylesheet" href="./src/ui/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230b0d10'/><rect x='7' y='9' width='18' height='14' rx='2' fill='%232b9bd8'/><rect x='5' y='7' width='5' height='5' rx='1.5' fill='%23e6eaf0'/><rect x='22' y='7' width='5' height='5' rx='1.5' fill='%23e6eaf0'/><rect x='5' y='20' width='5' height='5' rx='1.5' fill='%23e6eaf0'/><rect x='22' y='20' width='5' height='5' rx='1.5' fill='%23e6eaf0'/></svg>"
    />
  </head>
  <body>
    <div id="app">
      <div id="viewport">
        <canvas id="field-canvas"></canvas>
        <canvas id="label-canvas"></canvas>
        <div id="hud" class="hud"></div>
      </div>
      <aside id="panel"></aside>
    </div>
    <noscript>
      <p style="padding: 24px; color: #e6eaf0">
        This simulator needs JavaScript and WebGL2.
      </p>
    </noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
